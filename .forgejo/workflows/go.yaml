on:
  push:
  pull_request:
jobs:
  build:
    runs-on: docker
    container:
      image: git.myservermanager.com/msm/executor-ubuntu-build-essential:latest
    steps:
      - uses: actions/checkout@v3
        name: Checkout

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '^1.24'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
