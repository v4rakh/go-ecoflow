on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
jobs:
  build:
    runs-on: native
    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -shuffle on ./...
