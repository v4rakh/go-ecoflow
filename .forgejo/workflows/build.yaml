on: [ push ]
jobs:
  build:
    runs-on: native
    steps:
      - uses: actions/checkout@v6
        name: Checkout

      - name: Build
        run: |
          nix develop --command bash -c "go build -v ./..."

      - name: Checkstyle
        run: |
          nix develop --command bash -c "golangci-lint cache clean"
          nix develop --command bash -c "golangci-lint run"

      - name: Test
        run: |
          nix develop --command bash -c "go test -v -race -shuffle on ./..."
